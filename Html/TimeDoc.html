<!DOCTYPE html>
<html lang="en">
<head style="width: 100%; background-color: gray; border: 1px solid black;">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="../_vercel/insights/script.js"></script>
    <link
      href="../Css/custom.css" 
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.2/new.min.css"
    />
    <title>Task Management Demo</title>
    <meta
      name="description"
      content="High-performance HTML based website template."
    />
</head>

<body>
    <table style="width: 816px; height: 1056px; text-align: center; margin: 0 auto; border: 1px solid black;">
        <thead class="TableH" style="border: 1px solid black;">
            <th id="Proj_Name">#Project Name#</th>
        </thead>
        <tbody class="TableB" style="border: 1px solid black;">
            <tr>
                <th>SubTask</th><th>Catagory</th><th>Time</th>
            </tr>
            <tr id="timedoc_body">
                <td>#Task 1 Name#</td><td>#Task 1 Category#</td><td>#Tast 1 Time#</td>
            </tr>
        </tbody>
        <tfoot class="TableF" style="border: 1px solid black;">
            <tr>
                <th>Stats</th>
            </tr>
            <tr>
                <th> Longest SubTask </th>
            </tr>
            <tr>
                <td id="total_time_name">#SubTask Name#</td>
                <td id="total_time">#SubTask Time#</td>
            </tr>
            <tr>
                <th>Most Used Category</th>
                <td id="catagory">#Catagory Name#</td>
            </tr>
            <tr>
                <th>In memory of those who inspired us to create</th>
            </tr>
        </tfoot>
        
    </table>



    <script>
        async function fetchPostgresData() {
            try {
                const response = await fetch('http://localhost:3000/api/data');
                const data = await response.json();

                const bodytable = document.getElementById('timedoc_body');
                const totalname = document.getElementById('total_time_name');
                const totaltime = document.getElementById('total_time');
                const catagory = document.getElementById('catagory');
                
                const highesttime = 0;
                const highesttimename = null;

                //data.projects.forEach(row => {
                data.subtasks.forEach(row => {
                    if(recevedNumber === row.proj_id){
                        bodytable.innerHTML += `
                            <tr>
                                <td>${row.name}</td><td>${row.category}</td><td>${row.time}</td>
                            </tr>
                        `;
                        
                        if (row.time > highesttime){
                            highesttimename = row.name;
                            highesttime = row.time;
                        }
                        total_time_name.textContent = `${highesttimename}`;
                        total_time_name.textContent = `${highesttime}`;
                    }   
                });

                data.project.forEach(row => {
                    if(recevedNumber === row.id){
                        const data = [row.sub_code, row.sub_write, row.sub_music, row.sub_art, row.sub_misc];
                        const maxInt = Math.max(data.filter(item => typeof item === 'number' && Number.isSafeInteger(item)));  
                        catagory.textContent = `${maxInt}`;
                    }   
                });
            } 
            catch (error) {
                console.error('Error fetching data from API:', error);
            }
        }
        fetchPostgresData();
    </script>

</body>
