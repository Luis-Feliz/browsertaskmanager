    <script>
            function myFunction(x) {
            x.classList.toggle("change");
            }
            function toggleNav() {
            var element = document.getElementById("mySidenav");
                /*if the element is open close it*/  
                if (document.getElementById("mySidenav").style.width == "250px") {
                document.getElementById("mySidenav").style.width = "0";
                document.getElementById("main").style.marginLeft = "0";
                } else {
                /*if element closed, open it*/
                document.getElementById("mySidenav").style.width = "250px";
                document.getElementById("main").style.marginLeft = "250px";
                }
            }
            /* Set the width of the side navigation to 250px and the left margin of the page content to 250px */
            function openNav() {
                document.getElementById("mySidenav").style.width = "250px";
                document.getElementById("main").style.marginLeft = "250px";
            }
        
            /* Set the width of the side navigation to 0 and the left margin of the page content to 0 */
            function closeNav() {
                document.getElementById("mySidenav").style.width = "0";
                document.getElementById("main").style.marginLeft = "0";
            }
      </script>

<body>
  <h1 style="text-align: center"><u>Projects</u></h1>
  <!-- Demo Table -->

    <!-- Actual Project -->
  <table id="project-table" style="width: 100%; border: 1px solid black;"></table>  
  <script>
    async function fetchPostgresData() {
      try {
        const response = await fetch('http://localhost:3000/api/data');
        const data = await response.json();
        
        const projectTable = document.getElementById('project-table');
        
        data.projects.forEach(row => {
          const completionPercentage = (+row.sub_code + +row.sub_write + +row.sub_music + +row.sub_art + +row.sub_misc) / 5;
          const totalTime = JSON.stringify(row.time); // Assuming row.time is in the format "HH:MM:SS"

          
          projectTable.innerHTML += `
            <th style="height: 20%; text-align: left"><H1><u><a href="../Html/SubTask.html">${row.name}:</u></H1></th>
            <tr style="border: 1px solid black;">
              <td style="width: 20%; height: 100%; border: 1px solid black">${completionPercentage}</td>
              <td style="width: 60%; height: 100%; border: 1px solid black;">${row.description}</td>
              <td style="width: 20%; height: 100%; border: 1px solid black; text-align: right">${totalTime}</td>
            </tr>
            <tr>
              <td colspan="3">
                <div class="line"></div>
              </td>
            </tr>
            `;
        });
      } 
      catch (error) {
          console.error('Error fetching data from API:', error);
      }
    }

  fetchPostgresData();
  </script>


  <table style="width: 100%; border: 1px solid black;">

          Completion of selected skills:<br>
        </p>
      </td>
    </tr>
  </table>
