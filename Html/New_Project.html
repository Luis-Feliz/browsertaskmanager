            var element = document.getElementById("mySidenav");
                /*if the element is open close it*/  
                if (document.getElementById("mySidenav").style.width == "250px") {
                document.getElementById("mySidenav").style.width = "0";

<body>
<h1>New Project</h1>
<p>Values needed for the new project.</p>
    name|description|time|sub_code|sub_write|sub_music|sub_art|sub_misc
    <form id="userForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>

        <br>
        <button type="submit">Submit</button>
    </form>
    <p id="responseMsg"></p>

    <script>
        const form = document.getElementById('userForm');
        const responseMsg = document.getElementById('responseMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent standard page reload

            const newnameValue = document.getElementById('name').value;
            const newdescriptionValue = document.getElementById('description').value;
            responseMsg.textContent = 'Loading...';
            
            try {
                const response = await fetch('http://localhost:3050/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: 'newproject', newname: newnameValue, newdescription: newdescriptionValue })
                });
                
                const result = await response.json();

                if (response.ok) {
                    responseMsg.style.color = 'green';
                    responseMsg.textContent = result.message;
                    form.reset();
                } else {
                    responseMsg.style.color = 'red';
                    responseMsg.textContent = 'Failed to save data.' + (result.message ? ` Server message: ${result.message}` : '');
                }
            } catch (error) {
                console.error('Error:', error);
                responseMsg.style.color = 'red';
                responseMsg.textContent = 'Could not connect to the server.';
            }
        });
    </script>
</body>
